// Animert tall som teller seg opp
function useCountUp(target, dur = 700) {
  const [val, setVal] = React.useState(0);
  const ref = React.useRef(0);
  React.useEffect(() => {
    const start = performance.now(),
      from = ref.current;
    let raf;
    const tick = t => {
      const p = Math.min((t - start) / dur, 1);
      const e = 1 - Math.pow(1 - p, 3); // ease-out cubic
      const v = from + (target - from) * e;
      setVal(v);
      ref.current = v;
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, dur]);
  return val;
}

// ════════ TIDSLINJE ════════
// Vekttap: 70 kg → 55 kg til neste sommer (~juni 2027). Rolig ~0,35 kg/uke.
// Fokus: gå ned i vekt sunt og bærekraftig, bli slankere og sterkere. 165 cm.
const GOAL_DATE = "2027-03-15"; // ~35 uker ved 0,43 kg/uke
function phaseForDate(dateStr) {
  const d = new Date(dateStr);
  if (d <= new Date(GOAL_DATE)) return {
    key: "cut",
    name: "Vekttap",
    accent: C.pink
  };
  return {
    key: "maintain",
    name: "Vedlikehold",
    accent: C.teal
  };
}

// Vektmål for en gitt dato (lineær interpolasjon mellom milepæler)
function targetWeightForDate(dateStr) {
  const d = new Date(dateStr).getTime();
  const pts = [["2026-07-13", 70.0],
  // start
  ["2027-03-15", 55.0],
  // mål ~35 uker: ~0,43 kg/uke
  ["2027-09-01", 55.0] // vedlikehold
  ].map(([ds, w]) => [new Date(ds).getTime(), w]);
  if (d <= pts[0][0]) return pts[0][1];
  if (d >= pts[pts.length - 1][0]) return pts[pts.length - 1][1];
  for (let i = 0; i < pts.length - 1; i++) {
    if (d >= pts[i][0] && d <= pts[i + 1][0]) {
      const f = (d - pts[i][0]) / (pts[i + 1][0] - pts[i][0]);
      return +(pts[i][1] + f * (pts[i + 1][1] - pts[i][1])).toFixed(1);
    }
  }
  return pts[pts.length - 1][1];
}
function macrosForPhase(key, bw) {
  const p = Math.round(bw * 1.9); // høyt protein bevarer muskel + metthet under vekttap
  // Mifflin-St Jeor BMR for kvinne 165cm, ~28 år, × aktivitet 1.45
  const tdee = (10 * bw + 6.25 * 165 - 5 * 28 - 161) * 1.45;
  if (key === "cut") {
    const kcal = Math.round(tdee - 475); // moderat underskudd → ~0,43 kg/uke, starter ~1600
    return { kcal, p, c: Math.round((kcal - p * 4 - Math.round(bw * 0.8) * 9) / 4), f: Math.round(bw * 0.8) };
  }
  const kcal = Math.round(tdee);
  return { kcal, p, c: Math.round((kcal - p * 4 - Math.round(bw * 0.9) * 9) / 4), f: Math.round(bw * 0.9) };
}

// Ekstra kalorier for dagens kondisøkt (justerer maten etter treningen)
function cardioBonus(dayObj) {
  if (!dayObj) return { kcal: 0, label: "" };
  const focus = (dayObj.focus || "").toLowerCase();
  const type = dayObj.type;
  if (type === "bike" || focus.includes("sykkel")) return { kcal: 250, label: "🚴 Sykkeldag – litt ekstra", carbs: 45 };
  if (type === "run" || focus.includes("løp")) return { kcal: 250, label: "🏃 Løpedag – litt ekstra", carbs: 45 };
  if (type === "swim" || focus.includes("svøm")) return { kcal: 200, label: "🏊 Svømmedag – litt ekstra", carbs: 35 };
  if (focus.includes("kondis") || focus.includes("intervall") || focus.includes("gå") || type === "cardio") return { kcal: 200, label: "🔥 Kondisdag – litt ekstra", carbs: 35 };
  return { kcal: 0, label: "" };
}
// Dagens totale kaloriemål inkl. kondis
function dailyTarget(key, bw, dayObj) {
  const base = macrosForPhase(key, bw);
  const bonus = cardioBonus(dayObj);
  return {
    kcal: base.kcal + bonus.kcal,
    p: base.p,
    c: base.c + (bonus.carbs || 0),
    f: base.f,
    bonus,
  };
}

// ─── COACH (regelbasert) ───
function coachReply(input, ctx) {
  const t = input.toLowerCase();
  const {
    phase,
    today,
    tomorrow,
    bw
  } = ctx;
  const m = macrosForPhase(phase.key, bw);
  if (/(glemt|glemte|hoppa|hoppet|missa|mistet|skippa|droppa|ikke trent|fikk ikke|rakk ikke)/.test(t)) {
    return {
      tone: C.amber,
      title: "Glemt en økt? Ikke noe stress.",
      body: [`Én tapt økt betyr ingenting i det store bildet. Kroppen mister ikke fremgang av én dag.`, `IKKE doble opp i morgen – det gir dårligere kvalitet og skaderisiko.`, `Fortsett som normalt. I dag: «${today.focus}». Eller gå videre til «${tomorrow.focus}» i morgen.`, `Nøkkeløkt (tung styrke/intervall)? Bytt den med en lettere dag senere. Rolig kondis? Bare glem den.`]
    };
  }
  if (/(cheat|junk|pizza|burger|kebab|godteri|sjokolade|øl|alkohol|drakk|fest|overspis|spiste for mye|skeiet ut)/.test(t)) {
    const lean = phase.key === "cut" || phase.key === "recomp";
    return {
      tone: C.pink,
      title: lean ? "Cheat på cut/rekomp — vær obs." : "Cheat på bulk? Helt greit.",
      body: lean ? [`Du jobber mot lav fettprosent nå, så et stort cheat kan sette deg tilbake noen dager.`, `Men én glipp ødelegger ingenting. Gå tilbake til ~${m.kcal} kcal i morgen — ikke "straff" deg med ekstra kutt.`, `Drikk ekstra vann (cheat gir vannretensjon — vekten hopper 1–2 kg, IKKE fett).`, `Hold proteinet på ${m.p}g i morgen. Fortsett planen.`] : [`Du er i bulk, så ekstra kalorier går rett inn i overskuddet. Helt greit.`, `Nyt det. Få gjerne litt protein i måltidet så du holder ${m.p}g-målet.`, `Tren normalt i morgen. Ingen straff-kardio.`]
    };
  }
  if (/(syk|forkjøl|forkjølet|feber|vond i halsen|hoste|influensa|kvalm|magesyk|slapp)/.test(t)) {
    return {
      tone: C.blue,
      title: "Syk? Nakke-regelen.",
      body: [`Symptomer OVER halsen (nese, lett sår hals) = tren lett. UNDER halsen (bryst, feber) = HVIL.`, `Feber: ikke tren i det hele tatt. Kan gi hjertekomplikasjoner.`, `3–5 tapte dager koster nesten ingenting. Å presse gjennom koster uker.`, `Frisk igjen: start på 70% de første 2 dagene.`]
    };
  }
  if (/(trøtt|sliten|øm|ømme|utmattet|orker ikke|sover dårlig|lite søvn|overtrent|sovet)/.test(t)) {
    return {
      tone: C.violet,
      title: "Sliten? Lytt til det.",
      body: [`Vedvarende tretthet er kroppens viktigste signal – ofte for lite søvn.`, `Får du 8–9 timer? Hvis ikke, er DET problemet, ikke treningen.`, `Utbrent? Ekstra hviledag eller halv intensitet. Smart, ikke latskap.`, `Muskler bygges i HVILEN. Logg søvnen din i Mer-fanen så vi ser mønsteret.`]

<script>
// ═══════ SKY-SYNK KNAPP (utenfor React) ═══════
(function(){
  function pinStatus(){ return getSyncPin() ? "på" : "av"; }
  function __setSyncBadge(state){
    var b=document.getElementById("syncBadge"); if(!b) return;
    if(state==="saved"){ b.textContent="☁︎"; b.style.color="#2fe0c8"; }
    else if(state==="error"){ b.textContent="⚠︎"; b.style.color="#ff5277"; }
    else if(state==="saving"){ b.textContent="⟳"; b.style.color="#f5b301"; }
  }
  window.__setSyncBadge=__setSyncBadge;
  function makeBtn(){
    if(document.getElementById("syncFab")) return;
    var fab=document.createElement("button");
    fab.id="syncFab";
    fab.style.cssText="position:fixed;right:14px;bottom:86px;z-index:9999;width:46px;height:46px;border-radius:50%;border:1px solid rgba(47,224,200,0.4);background:rgba(16,19,26,0.92);backdrop-filter:blur(8px);color:#2fe0c8;font-size:20px;cursor:pointer;box-shadow:0 6px 18px -6px rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;";
    var span=document.createElement("span"); span.id="syncBadge"; span.textContent = getSyncPin()? "☁︎":"☁"; span.style.color = getSyncPin()? "#2fe0c8":"#5c6678";
    fab.appendChild(span);
    fab.onclick=function(){
      var cur=getSyncPin();
      if(cur){
        var v=confirm("Sky-synk er PÅ (kode: "+cur+").\n\nData synkes automatisk. Trykk OK for å slå AV synk (data blir liggende lokalt), eller Avbryt for å beholde.");
        if(v){ try{ localStorage.removeItem("pt_sync_pin"); }catch(e){} alert("Synk slått av."); var s=document.getElementById("syncBadge"); s.textContent="☁"; s.style.color="#5c6678"; }
      } else {
        var pin=prompt("SKY-SYNK – aldri mist data 🔒\n\nVelg en kode (min. 4 tegn). Dataene dine lagres i skyen under koden.\nBruk SAMME kode på en annen telefon for å hente dem.\n\nSkriv inn kode:");
        if(pin===null) return;
        pin=pin.trim();
        if(pin.length<4){ alert("Koden må være minst 4 tegn."); return; }
        if(!window.__fbReady){ alert("Får ikke kontakt med skyen. Sjekk internett og prøv igjen."); return; }
        __setSyncBadge("saving");
        cloudPull(pin).then(function(r){
          if(!r.ok){ alert("Kunne ikke koble til – sjekk nett."); __setSyncBadge("error"); return; }
          try{ localStorage.setItem("pt_sync_pin",pin); }catch(e){}
          if(r.empty){
            var payload={}; syncKeys().forEach(function(k){ var v=localStorage.getItem(k); if(v!==null) payload[k]=v; }); payload.__updated=Date.now();
            window.__db.collection("brukere").doc(pin).set(payload).then(function(){
              alert("✓ Synk PÅ! Dataene dine er nå trygge i skyen.\n\nBruk koden \""+pin+"\" på andre enheter.");
              var s=document.getElementById("syncBadge"); s.textContent="☁︎"; s.style.color="#2fe0c8";
            });
          } else {
            alert("✓ Fant dataene dine i skyen! Laster inn...");
            setTimeout(function(){ window.location.reload(); },600);
          }
        });
      }
    };
    document.body.appendChild(fab);
  }
  if(document.readyState==="complete"||document.readyState==="interactive"){ setTimeout(makeBtn,800); }
  else { window.addEventListener("DOMContentLoaded",function(){ setTimeout(makeBtn,800); }); }
  // Ved oppstart: hvis PIN finnes, hent fra sky
  setTimeout(function(){
    var pin=getSyncPin();
    if(pin && window.__fbReady){
      cloudPull(pin).then(function(r){ if(r.ok && !r.empty){ /* allerede lokalt, ikke reload i loop */ } });
    }
  },1200);
})();
</script>
